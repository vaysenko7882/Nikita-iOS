name: CodeGram native UI
on:
  workflow_dispatch:
  push:
    branches: [codex/codegram-14.2-native-energy, codex/codegram-14.3-catchup-media, codex/codegram-14.4-links-profile-icons]
permissions:
  contents: read
  actions: read
concurrency:
  group: codegram-native-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-history:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Select pinned Xcode
        run: |
          CODEGRAM_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${CODEGRAM_XCODE}.app/Contents/Developer"
          xcodebuild -version
      - name: Check automatic profile history updates without manual refresh
        run: bash tools/nikita/check_profile_history_ui.sh "$RUNNER_TEMP/codegram-profile-ui"
      - name: Retain history frames and regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeGram-history-UI-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-profile-ui
          if-no-files-found: error
          retention-days: 14
  native-settings:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Select pinned Xcode
        run: |
          CODEGRAM_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${CODEGRAM_XCODE}.app/Contents/Developer"
          xcodebuild -version
      - name: Check matte UI policy and Watch source syntax
        run: |
          python3 tools/nikita/check_matte_ui.py
          xcrun swiftc -frontend -parse "Telegram/WatchApp/tgwatch Watch App/Messages/MessageListView.swift" "Telegram/WatchApp/tgwatch Watch App/Messages/ReplyBar.swift"
      - name: Check and record production UIKit settings controls
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 tools/nikita/generate_icon.py
          bash tools/nikita/check_settings_ui.sh "$RUNNER_TEMP/codegram-ui"
      - name: Retain native frames and regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeGram-native-UI-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-ui
          if-no-files-found: error
          retention-days: 14

  native-material:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Select pinned Xcode
        run: |
          CODEGRAM_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${CODEGRAM_XCODE}.app/Contents/Developer"
          xcodebuild -version
      - name: Check modern geometry with optical material disabled
        run: bash tools/nikita/check_modern_material_ui.sh "$RUNNER_TEMP/codegram-modern-material"
      - name: Retain native recording and regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CodeGram-modern-material-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-modern-material
          if-no-files-found: error
          retention-days: 14
  native-video-status:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Select pinned Xcode
        run: |
          CODEGRAM_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${CODEGRAM_XCODE}.app/Contents/Developer"
          xcodebuild -version
      - name: Check nonmodal video status and ongoing text input
        run: bash tools/nikita/check_video_status_ui.sh "$RUNNER_TEMP/codegram-video-status"
      - name: Retain native recording and regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CodeGram-video-status-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-video-status
          if-no-files-found: error
          retention-days: 14

  visual-evidence:
    if: ${{ always() && !cancelled() }}
    needs: [native-history, native-settings, native-material, native-video-status]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install evidence rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download all native UI artifacts from this run
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: ${{ runner.temp }}/codegram-ui-input
      - name: Render complete UI evidence and print reconstructable images
        if: ${{ !cancelled() }}
        env:
          CODEGRAM_NATIVE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 tools/nikita/collect_ui_evidence.py \
            --input "$RUNNER_TEMP/codegram-ui-input" \
            --output "$RUNNER_TEMP/codegram-ui-evidence" \
            --tile-width 180 --emit-chunks
      - name: Retain labelled sheets, PTS index and evidence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeGram-visual-evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-ui-evidence
          if-no-files-found: error
          retention-days: 14
