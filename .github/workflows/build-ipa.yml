name: Build Autismex 2.3 unsigned IPA
on:
  push:
    branches: [codex/autismex-ios-2-3-20261113]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autismex-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_27*.app /Applications/Xcode_26*.app /Applications/Xcode.app; do
            if [ -d "$candidate/Contents/Developer" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build app and widgets for iPhone ARM64
        run: bash scripts/build-unsigned-ipa.sh
      - name: Upload compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: Autismex-2.3-unsigned-IPA
          path: |
            Autismex-2.3-unsigned.ipa
            Autismex-2.3-unsigned.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 14
