name: CodeGram host performance checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-performance:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Select pinned Xcode
        run: |
          CODEGRAM_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${CODEGRAM_XCODE}.app/Contents/Developer"
          xcodebuild -version
          xcrun swiftc --version
      - name: Typecheck native helpers and measure production hot paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codegram-performance"
          {
            xcrun swiftc --version
            git rev-parse HEAD
            python3 tools/nikita/check_swift.py
            python3 tools/nikita/check_archive_state.py
            xcrun swiftc -Osize -whole-module-optimization -warnings-as-errors submodules/TelegramUIPreferences/Sources/MessageFilterHistoryWindow.swift tools/nikita/tests/HistoryWindowCheck.swift -o "$RUNNER_TEMP/codegram-history-window-check"
            "$RUNNER_TEMP/codegram-history-window-check" | tee "$RUNNER_TEMP/codegram-performance/history-window.json"
          } 2>&1 | tee "$RUNNER_TEMP/codegram-performance/host-checks.log"
      - name: Retain workload counts and host timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeGram-host-performance-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-performance
          if-no-files-found: warn
          retention-days: 14
