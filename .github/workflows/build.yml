name: Build CodeGram IPA
on:
  workflow_dispatch:
  push:
    branches: [nikita/v2, codex/codegram-14.4-links-profile-icons, codex/codegram-14.6-performance-save]
permissions:
  contents: read
concurrency:
  group: ${{ (github.ref == 'refs/heads/nikita/v2' || contains(github.event.head_commit.message, '[build ipa]') || github.event_name == 'workflow_dispatch') && 'nikita-device-build' || format('nikita-device-skipped-{0}', github.sha) }}
  cancel-in-progress: false
jobs:
  host-performance:
    if: github.ref == 'refs/heads/nikita/v2' || contains(github.event.head_commit.message, '[build ipa]') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/codegram-performance.yml
  build:
    needs: host-performance
    if: github.ref == 'refs/heads/nikita/v2' || contains(github.event.head_commit.message, '[build ipa]') || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare personal API configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python3 tools/nikita/configure.py
      - name: Select pinned Xcode
        run: |
          NIKITA_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          test -d "/Applications/Xcode_${NIKITA_XCODE}.app/Contents/Developer"
          sudo xcode-select -s "/Applications/Xcode_${NIKITA_XCODE}.app/Contents/Developer"
          xcodebuild -version
          df -h .
      - name: Prepare reusable toolchain cache
        id: cache-config
        run: python3 tools/nikita/cache_settings.py prepare
      - name: Restore Bazel actions and downloaded repositories
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: nikita-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-config.outputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            nikita-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-config.outputs.toolchain }}-
      - name: Check source, server journal and voice effects
        run: |
          python3 -m unittest discover -s tools/nikita/tests -v
          python3 -m pip install --disable-pip-version-check ./server Pillow==11.3.0
          python3 -m unittest discover -s server/tests -v
          bash -n server/install.sh
          python3 tools/nikita/check_swift.py
          python3 build-system/Make/PostboxImportCheck.py
          python3 tools/nikita/check_matte_ui.py
          python3 tools/nikita/check_archive_state.py
          python3 tools/nikita/check_external_share.py
          xcrun swiftc -O submodules/TelegramCore/Sources/Nikita/NikitaVoiceProcessor.swift tools/nikita/tests/VoiceProcessorCheck.swift -o "$RUNNER_TEMP/nikita-voice-check"
          "$RUNNER_TEMP/nikita-voice-check"
          xcrun swiftc -O submodules/TelegramCore/Sources/Nikita/CodeGramEnergyPolicy.swift tools/nikita/tests/EnergyPolicyCheck.swift -o "$RUNNER_TEMP/codegram-energy-check"
          "$RUNNER_TEMP/codegram-energy-check"
          xcrun swiftc -O -warnings-as-errors submodules/TelegramCore/Sources/Nikita/CodeGramMediaConsumptionPolicy.swift submodules/TelegramCore/Sources/Nikita/CodeGramArchiveTokenCache.swift tools/nikita/tests/CatchupPolicyCheck.swift -o "$RUNNER_TEMP/codegram-catchup-check"
          "$RUNNER_TEMP/codegram-catchup-check"
          xcrun swiftc -O -warnings-as-errors submodules/SaveToCameraRoll/Sources/CodeGramExportFile.swift tools/nikita/tests/MediaExportFileCheck.swift -o "$RUNNER_TEMP/codegram-export-check"
          "$RUNNER_TEMP/codegram-export-check"
          xcrun swiftc -O -warnings-as-errors submodules/TelegramUIPreferences/Sources/CodeGramSettingsCache.swift tools/nikita/tests/SettingsCacheCheck.swift -o "$RUNNER_TEMP/codegram-settings-cache-check"
          "$RUNNER_TEMP/codegram-settings-cache-check"
          xcrun swiftc -O -warnings-as-errors submodules/TelegramCore/Sources/TelegramEngine/Privacy/BlockedPeersPagination.swift tools/nikita/tests/BlockedPeersPaginationCheck.swift -o "$RUNNER_TEMP/codegram-blocked-pagination-check"
          "$RUNNER_TEMP/codegram-blocked-pagination-check"
      - name: Fetch pinned dependencies
        run: python3 tools/nikita/configure.py --submodules
      - name: Compile CodeGram for iPhone
        id: compile
        run: bash tools/nikita/build.sh
      - name: Checksum build metadata
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          metadata = Path('build/nikita/Build.json')
          metadata.with_name('Build.json.sha256').write_text(hashlib.sha256(metadata.read_bytes()).hexdigest() + '  Build.json\n')
          PY
      - name: Retain compiled IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeGram-iPhone-${{ github.run_number }}
          path: |
            build/nikita/CodeGram.ipa
            build/nikita/CodeGram.ipa.sha256
            build/nikita/Build.json
            build/nikita/Build.json.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Bound reusable cache
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.compile.outcome != 'skipped' && steps.compile.outcome != '' }}
        run: python3 tools/nikita/cache_settings.py prune
      - name: Save reusable build results
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.compile.outcome != 'skipped' && steps.compile.outcome != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: nikita-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-config.outputs.toolchain }}-${{ github.sha }}
      - name: Remove temporary API configuration
        if: always()
        run: rm -f build-system/nikita-local-configuration.json

  verify-release:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check release verifier rejection cases
        run: python3 -m unittest discover -s tools/nikita/tests -p test_verify_release_bundle.py -v
      - name: Download this run's compiled artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CodeGram-iPhone-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-release
      - name: Verify downloaded bytes and compiled device bundles
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 tools/nikita/verify_release_bundle.py "$RUNNER_TEMP/codegram-release" \
            --expected-sha "$EXPECTED_SOURCE_SHA" --expected-build "$EXPECTED_BUILD_NUMBER" \
            --expected-version 14.7.0 --report "$RUNNER_TEMP/codegram-release-verification.json"
      - name: Retain release integrity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CodeGram-release-verification-${{ github.run_number }}
          path: ${{ runner.temp }}/codegram-release-verification.json
          if-no-files-found: warn
          retention-days: 14
