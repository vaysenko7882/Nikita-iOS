name: Build Nikita IPA
on:
  workflow_dispatch:
  push:
    branches: [nikita/v2]
permissions:
  contents: read
concurrency:
  group: nikita-device-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare personal API configuration
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: python3 tools/nikita/configure.py
      - name: Select pinned Xcode
        run: |
          NIKITA_XCODE=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          test -d "/Applications/Xcode_${NIKITA_XCODE}.app/Contents/Developer"
          sudo xcode-select -s "/Applications/Xcode_${NIKITA_XCODE}.app/Contents/Developer"
          xcodebuild -version
          df -h .
      - name: Prepare reusable toolchain cache
        id: cache-config
        run: python3 tools/nikita/cache_settings.py prepare
      - name: Restore Bazel actions and downloaded repositories
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: nikita-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-config.outputs.toolchain }}-${{ github.sha }}
          restore-keys: |
            nikita-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-config.outputs.toolchain }}-
      - name: Check source, server journal and voice effects
        run: |
          python3 -m unittest discover -s tools/nikita/tests -v
          python3 -m pip install --disable-pip-version-check ./server
          python3 -m unittest discover -s server/tests -v
          bash -n server/install.sh
          python3 tools/nikita/check_swift.py
          python3 tools/nikita/check_archive_state.py
          xcrun swiftc -O submodules/TelegramCore/Sources/Nikita/NikitaVoiceProcessor.swift tools/nikita/tests/VoiceProcessorCheck.swift -o "$RUNNER_TEMP/nikita-voice-check"
          "$RUNNER_TEMP/nikita-voice-check"
      - name: Fetch pinned dependencies
        run: python3 tools/nikita/configure.py --submodules
      - name: Compile Nikita for iPhone
        id: compile
        run: bash tools/nikita/build.sh
      - name: Retain compiled IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Nikita-iPhone-${{ github.run_number }}
          path: |
            build/nikita/Nikita.ipa
            build/nikita/Nikita.ipa.sha256
            build/nikita/Build.json
          if-no-files-found: error
          retention-days: 14
      - name: Bound reusable cache
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.compile.outcome != 'skipped' && steps.compile.outcome != '' }}
        run: python3 tools/nikita/cache_settings.py prune
      - name: Save reusable build results
        continue-on-error: true
        if: ${{ always() && !cancelled() && steps.compile.outcome != 'skipped' && steps.compile.outcome != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: nikita-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-config.outputs.toolchain }}-${{ github.sha }}
      - name: Remove temporary API configuration
        if: always()
        run: rm -f build-system/nikita-local-configuration.json
