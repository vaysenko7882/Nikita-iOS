name: Build Na Svyazi iPhone radio
on:
  push:
    branches: [codex/na-svyazi-ios-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: radio-app
          persist-credentials: false
      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_27*.app /Applications/Xcode.app; do
            if [ -d "$candidate/Contents/Developer" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
      - name: Build native iPhone app
        run: bash radio-app/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NaSvyazi-iPhone-unsigned
          path: |
            radio-app/NaSvyazi-unsigned.ipa
            radio-app/NaSvyazi-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
