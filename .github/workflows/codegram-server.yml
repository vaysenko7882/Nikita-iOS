name: CodeGram server and link regressions
on:
  push:
    branches: [codex/codegram-14.4-links-profile-icons, nikita/v2]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install --disable-pip-version-check ./server
      - run: python3 -m unittest discover -s server/tests -v
      - run: bash -n server/install.sh

